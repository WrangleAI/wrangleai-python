[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wrangleai"
version = "0.3.0"
description = "Official Python client for Wrangle AI. OpenAI-compatible smart routing and cost tracking."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
  {name = "Wrangle AI", email = "support@wrangleai.com"}
]
keywords = ["wrangleai", "openai", "ai", "llm", "smart-routing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "typing-extensions>=4.5.0; python_version < '3.10'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "respx>=0.20.0",
    "mypy>=1.0.0",
]

[project.urls]
"Homepage" = "https://wrangleai.com"